name: Update Profile Metrics

on:
  schedule:
    # Runs once a day at 05:30 UTC — change this cron if you want a different cadence
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Visual theme (matches the README's dark/violet palette)
          plugin_lines: yes
          plugin_lines_sections: base
          config_display: large

      - name: Commit updated metrics.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git diff --staged --quiet || git commit -m "chore: update metrics.svg [skip ci]"
          git push
